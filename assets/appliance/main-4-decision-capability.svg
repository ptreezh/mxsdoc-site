<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#FFFFFF"/>

  <!-- Top: Logo -->
  <rect x="0" y="0" width="800" height="60" fill="#12253F"/>
  <text x="40" y="40" font-family="PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#E8B13A">MxsDoc</text>
  <text x="760" y="40" font-family="PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">Lux 判断与决策能力</text>

  <!-- Title -->
  <text x="400" y="120" font-family="PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#12253F" text-anchor="middle">Lux 判断与决策能力</text>
  <text x="400" y="155" font-family="PingFang SC, sans-serif" font-size="20" fill="#1A5FB4" font-weight="600" text-anchor="middle">结构化判断 · 可复核 · 可代码解析</text>

  <!-- 4 quadrants -->
  <!-- Top-left: 工艺审批 -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#FAFAFA" stroke="#E8B13A" stroke-width="3"/>
    <text x="20" y="40" font-family="PingFang SC, sans-serif" font-size="36">📋</text>
    <text x="20" y="80" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#12253F">工艺审批</text>
    <rect x="20" y="100" width="80" height="24" rx="12" fill="#E8B13A"/>
    <text x="60" y="117" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#12253F" text-anchor="middle">SCORE</text>
    <text x="20" y="150" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B">自动给参数合规性评分</text>
    <text x="20" y="175" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1A5FB4">输出: 0-3 档</text>
    <text x="20" y="200" font-family="PingFang SC, sans-serif" font-size="12" fill="#94A3B8">例：合规性 = 0.85 → 通过</text>
  </g>

  <!-- Top-right: 工单路由 -->
  <g transform="translate(420, 220)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#FAFAFA" stroke="#E8B13A" stroke-width="3"/>
    <text x="20" y="40" font-family="PingFang SC, sans-serif" font-size="36">🎯</text>
    <text x="20" y="80" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#12253F">工单路由</text>
    <rect x="20" y="100" width="80" height="24" rx="12" fill="#1A5FB4"/>
    <text x="60" y="117" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">CHOICE</text>
    <text x="20" y="150" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B">自动分配到处理组</text>
    <text x="20" y="175" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1A5FB4">输出: 3 个组 + 概率</text>
    <text x="20" y="200" font-family="PingFang SC, sans-serif" font-size="12" fill="#94A3B8">例：售后 0.7 / 技术 0.25 / 销售 0.05</text>
  </g>

  <!-- Bottom-left: 风险拦截 -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#FAFAFA" stroke="#E8B13A" stroke-width="3"/>
    <text x="20" y="40" font-family="PingFang SC, sans-serif" font-size="36">🛡️</text>
    <text x="20" y="80" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#12253F">风险拦截</text>
    <rect x="20" y="100" width="80" height="24" rx="12" fill="#EF4444"/>
    <text x="60" y="117" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">NOUL</text>
    <text x="20" y="150" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B">判断是否 Prompt Injection</text>
    <text x="20" y="175" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1A5FB4">输出: 0-1 真伪概率</text>
    <text x="20" y="200" font-family="PingFang SC, sans-serif" font-size="12" fill="#94A3B8">例：注入风险 = 0.92 → 拦截</text>
  </g>

  <!-- Bottom-right: 意图识别 -->
  <g transform="translate(420, 470)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#FAFAFA" stroke="#E8B13A" stroke-width="3"/>
    <text x="20" y="40" font-family="PingFang SC, sans-serif" font-size="36">💬</text>
    <text x="20" y="80" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#12253F">意图识别</text>
    <rect x="20" y="100" width="80" height="24" rx="12" fill="#1A5FB4"/>
    <text x="60" y="117" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">CHOICE</text>
    <text x="20" y="150" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B">用户消息自动分类</text>
    <text x="20" y="175" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1A5FB4">输出: 4 分类 + 概率</text>
    <text x="20" y="200" font-family="PingFang SC, sans-serif" font-size="12" fill="#94A3B8">例：咨询 0.65 / 投诉 0.25 / ...</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="720" width="800" height="80" fill="#12253F"/>
  <text x="400" y="755" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#E8B13A" text-anchor="middle">TypeSafe System One 协议兼容 · 结构化可代码解析</text>
  <text x="400" y="785" font-family="PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">仅输出确定性决策 · 消除 AI 幻觉 · 可代码解析</text>
</svg>